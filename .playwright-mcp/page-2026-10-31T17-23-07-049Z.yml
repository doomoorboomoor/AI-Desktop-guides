    - region [ref=f4e142]:
      - heading "How to use the packs with New+" [level=2] [ref=f4e143]
      - list [ref=f4e144]:
        - listitem [ref=f4e145]:
          - strong [ref=f4e146]: Download and extract the whole ZIP.
          - text: Use the complete collection link or an app's separate ZIP card, then extract to a normal folder. Do not run scripts inside a ZIP preview.
        - listitem [ref=f4e147]:
          - strong [ref=f4e148]: Enable PowerToys New+.
          - text: Open PowerToys Settings and enable New+. Reading the guides requires neither PowerToys nor Python.
        - listitem [ref=f4e149]:
          - strong [ref=f4e150]: Install the templates.
          - text: Read the extracted README, then run
          - code [ref=f4e151]: Install-NewPlus-Templates.cmd
          - text: . It skips existing same-named entries. To refresh matching entries with backups, run
          - code [ref=f4e152]: .\Install-NewPlus-Templates.ps1 -Overwrite
          - text: from the extracted folder.
        - listitem [ref=f4e153]:
          - strong [ref=f4e154]: Or copy selected entries manually.
          - text: Choose
          - strong [ref=f4e155]: New+ → Open templates
          - text: in File Explorer and copy the desired items from
          - code [ref=f4e156]: NewPlus-Templates/
          - text: into that folder. Copy its contents, not the enclosing directory.
        - listitem [ref=f4e157]:
          - strong [ref=f4e158]: Create a guide or workspace.
          - text: Right-click an empty area in your destination folder, choose
          - strong [ref=f4e159]: New+
          - text: ", then select a complete guide, an editable source project, an Atlas workspace, or the full library. New+ creates a copy."
        - listitem [ref=f4e160]:
          - strong [ref=f4e161]: Edit and rebuild when needed.
          - text: In an editable guide project, change
          - code [ref=f4e162]: content/guide.md
          - text: and
          - code [ref=f4e163]: guide.config.json
          - text: ", then run"
          - code [ref=f4e164]: Build-Guide.cmd
          - text: . Python 3.9+ is needed only for rebuilding. The full library has
          - code [ref=f4e165]: Build-Library.cmd
          - text: for rebuilding every guide and the master from its saved Markdown sources.
      - paragraph [ref=f4e166]:
        - code [ref=f4e167]: "#Old/"
        - text: stores previous revisions;
        - code [ref=f4e168]: "#Temp/"
        - text: stores temporary work. They are not active source directories. Optional dated templates require New+'s filename-variable setting; variables change names, not file contents. The installer does not enable settings, sign into AI applications, or connect accounts.
      - paragraph [ref=f4e169]:
        - link "Microsoft's New+ documentation" [ref=f4e170] [cursor=pointer]:
          - /url: https://learn.microsoft.com/en-us/windows/powertoys/newplus
        - text: ·
        - link "Local library maintenance guide" [ref=f4e171] [cursor=pointer]:
          - /url: README.md
    - paragraph [ref=f4e173]: The original manuals retain their product-verification dates. This collection's HTML/build checks do not establish native app installation or account entitlement. All reading features work offline; Google Drive and external documentation require internet access.