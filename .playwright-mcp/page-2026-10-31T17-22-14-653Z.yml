    - region [ref=f3e142]:
      - heading "How to use the packs with New+" [level=2] [ref=f3e143]
      - list [ref=f3e144]:
        - listitem [ref=f3e145]:
          - strong [ref=f3e146]: Download and extract the whole ZIP.
          - text: Use the complete collection link or an app's separate ZIP card, then extract to a normal folder. Do not run scripts inside a ZIP preview.
        - listitem [ref=f3e147]:
          - strong [ref=f3e148]: Enable PowerToys New+.
          - text: Open PowerToys Settings and enable New+. Reading the guides requires neither PowerToys nor Python.
        - listitem [ref=f3e149]:
          - strong [ref=f3e150]: Install the templates.
          - text: Read the extracted README, then run
          - code [ref=f3e151]: Install-NewPlus-Templates.cmd
          - text: . It skips existing same-named entries. To refresh matching entries with backups, run
          - code [ref=f3e152]: .\Install-NewPlus-Templates.ps1 -Overwrite
          - text: from the extracted folder.
        - listitem [ref=f3e153]:
          - strong [ref=f3e154]: Or copy selected entries manually.
          - text: Choose
          - strong [ref=f3e155]: New+ → Open templates
          - text: in File Explorer and copy the desired items from
          - code [ref=f3e156]: NewPlus-Templates/
          - text: into that folder. Copy its contents, not the enclosing directory.
        - listitem [ref=f3e157]:
          - strong [ref=f3e158]: Create a guide or workspace.
          - text: Right-click an empty area in your destination folder, choose
          - strong [ref=f3e159]: New+
          - text: ", then select a complete guide, an editable source project, an Atlas workspace, or the full library. New+ creates a copy."
        - listitem [ref=f3e160]:
          - strong [ref=f3e161]: Edit and rebuild when needed.
          - text: In an editable guide project, change
          - code [ref=f3e162]: content/guide.md
          - text: and
          - code [ref=f3e163]: guide.config.json
          - text: ", then run"
          - code [ref=f3e164]: Build-Guide.cmd
          - text: . Python 3.9+ is needed only for rebuilding. The full library has
          - code [ref=f3e165]: Build-Library.cmd
          - text: for rebuilding every guide and the master from its saved Markdown sources.
      - paragraph [ref=f3e166]:
        - code [ref=f3e167]: "#Old/"
        - text: stores previous revisions;
        - code [ref=f3e168]: "#Temp/"
        - text: stores temporary work. They are not active source directories. Optional dated templates require New+'s filename-variable setting; variables change names, not file contents. The installer does not enable settings, sign into AI applications, or connect accounts.
      - paragraph [ref=f3e169]:
        - link "Microsoft's New+ documentation" [ref=f3e170] [cursor=pointer]:
          - /url: https://learn.microsoft.com/en-us/windows/powertoys/newplus
        - text: ·
        - link "Local library maintenance guide" [ref=f3e171] [cursor=pointer]:
          - /url: publishing.html
    - paragraph [ref=f3e173]: The original manuals retain their product-verification dates. This collection's HTML/build checks do not establish native app installation or account entitlement. For offline reading, use the standalone HTML exports; Google Drive and external documentation require internet access.