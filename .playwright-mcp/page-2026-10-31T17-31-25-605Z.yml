                - paragraph [ref=f40e736]:
                  - text: Each app card and guide footer links to its own three-entry ZIP. The combined collection remains available.
                  - code [ref=f40e737]: Authoring/distribution.json
                  - text: stores the seven app URLs and the combined URL;
