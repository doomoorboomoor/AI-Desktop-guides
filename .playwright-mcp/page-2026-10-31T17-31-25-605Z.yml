                      - cell "Workspaces, agents, and Gateway boundaries" [ref=f40e655]
                - paragraph [ref=f40e656]: The library includes searchable sections, complete code examples, Mermaid diagram previews, Markdown source downloads, mobile navigation, dark mode, and printable guides. Standalone HTML exports support offline reading; the website shares cached assets between pages. Template ZIPs are linked from the website; individual Drive packs may require access permission.
                - generic [ref=f40e657]:
                  - heading "Publish on GitHub Pages" [level=2] [ref=f40e658]
                  - 'link "Permalink: Publish on GitHub Pages" [ref=f40e659] [cursor=pointer]':
                    - /url: "#publish-on-github-pages"
                - paragraph [ref=f40e662]:
                  - text: For crawler metadata, sitemap submission, and Google Search Console verification, see
                  - link "Search engine setup" [ref=f40e663] [cursor=pointer]:
                    - /url: /doomoorboomoor/AI-Desktop-guides/blob/main/SEARCH-ENGINE-SETUP.md
                  - text: . SEO settings live in
                  - code [ref=f40e664]: Authoring/site.json
                  - text: ; indexing is separate from publishing.
                - paragraph [ref=f40e665]:
                  - text: Run
                  - code [ref=f40e666]: python Build-Pages.py
                  - text: from this folder. It rebuilds the seven manuals from canonical Markdown, validates local links and every search destination, and writes the website to
                  - code [ref=f40e667]: _site/
                  - text: . Python 3.9+ is required; dependencies are bundled. No npm installation is needed.
                - paragraph [ref=f40e668]:
                  - text: Preview with
                  - code [ref=f40e669]: python -m http.server 8000 --directory _site
                  - text: ", then open"
                  - link "http://localhost:8000" [ref=f40e670] [cursor=pointer]:
                    - /url: http://localhost:8000
                  - text: . Stop the preview with Ctrl+C.
                - paragraph [ref=f40e671]:
                  - text: Commit and push the source changes to
                  - code [ref=f40e672]: main
                  - text: . In the GitHub repository, open
                  - strong [ref=f40e673]: Settings → Pages → Build and deployment → Source → GitHub Actions
                  - text: . The included
                  - code [ref=f40e674]: .github/workflows/pages.yml
                  - text: builds and validates pull requests; pushes to
                  - code [ref=f40e675]: main
                  - text: also publish the validated
                  - code [ref=f40e676]: _site
                  - text: artifact. The expected URL is
                  - link "https://doomoorboomoor.github.io/AI-Desktop-guides/" [ref=f40e677] [cursor=pointer]:
                    - /url: https://doomoorboomoor.github.io/AI-Desktop-guides/
                  - text: once deployment succeeds. You can also run the workflow manually from the Actions tab.
                - paragraph [ref=f40e678]: "The publishing layout is:"
                - generic [ref=f40e679]:
                  - code [ref=f40e681]: "#Source/ Canonical guide Markdown and historical inputs Authoring/ Metadata, diagram previews, and bundled build engine Build-Library.py Standalone offline HTML build Build-Pages.py Optimized website build and link validation .github/workflows/ GitHub Pages build and deployment _site/ Generated website only (ignored by Git) index.html Library navigation and full-text search <app-slug>.html Seven complete manuals with lowercase URLs assets/ Shared, content-hashed CSS and JavaScript 404.html Missing-page recovery"
                  - button "Copy code to clipboard" [ref=f40e683] [cursor=pointer]
                - paragraph [ref=f40e687]:
                  - text: Only generated pages and their shared assets are published. Scratch folders, archives, authoring projects, and original uploads are excluded from the deployment artifact. Guide text, source downloads, diagrams, template download links, and the existing mobile and print layouts are retained. The published pages share cacheable assets; the root HTML exports remain self-contained. Keep the entire
                  - code [ref=f40e688]: _site
                  - text: folder together when copying the website.
                - paragraph [ref=f40e689]:
                  - text: Links are relative, so navigation and assets work beneath the repository's GitHub Pages path. The 404 recovery URL and repository link in Build-Pages.py are specific to this repository; update them if you fork it. Historical
                  - code [ref=f40e690]: claude-code-Desktop.html
                  - text: links redirect with their section fragments. Use the canonical lowercase
                  - code [ref=f40e691]: chatgpt-desktop.html
                  - text: when sharing links.
                - paragraph [ref=f40e692]:
                  - text: The validation report is saved to
                  - code [ref=f40e693]: "#Temp/pages-validation.json"
                  - text: . Publishing does not update the separate Google Drive ZIPs. For workflow details, see
                  - link "GitHub's custom Pages workflow documentation" [ref=f40e694] [cursor=pointer]:
                    - /url: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
                  - text: .
                - paragraph [ref=f40e695]: "Seven complete manuals: Claude Desktop, Claude Code, ChatGPT Desktop, Codex Desktop, Gemini Desktop, Hermes Desktop, and OpenClaw."
                - paragraph [ref=f40e696]:
                  - text: Open
                  - code [ref=f40e697]: index.html
                  - text: to browse the guides, search all seven, get the shared Google Drive template ZIP, or read New+ usage instructions. Keep the eight HTML files together. All reading assets are embedded; external links need internet.
                - generic [ref=f40e698]:
                  - heading "Authoring authority" [level=2] [ref=f40e699]
                  - 'link "Permalink: Authoring authority" [ref=f40e700] [cursor=pointer]':
                    - /url: "#authoring-authority"
                - paragraph [ref=f40e703]:
                  - text: Root
                  - code [ref=f40e704]: PROJECT.md
                  - text: defines this documentation project's policy. The seven numbered Markdown guides under
                  - code [ref=f40e705]: "#Source/"
                  - text: are the canonical guide text. Other comparison files under
                  - code [ref=f40e706]: "#Source/"
                  - text: are historical research inputs, not verified product specifications and not automatically published.
                - paragraph [ref=f40e707]:
                  - text: Edit guide text in
                  - code [ref=f40e708]: "#Source/"
                  - text: ; edit display metadata under
                  - code [ref=f40e709]: Authoring/config/
                  - text: . Run
                  - code [ref=f40e710]: Build-Library.cmd
                  - text: or
                  - code [ref=f40e711]: ./Build-Library.ps1
                  - text: to rebuild every guide and the master index. On macOS/Linux run
                  - code [ref=f40e712]: python3 Build-Library.py
                  - text: . Python 3.9+ is required only for rebuilding. Dependencies are bundled with licenses. No package installation, account connection, or server is required.
                - paragraph [ref=f40e713]:
                  - text: Both the sidebar and the in-body Contents list regenerate from actual headings. HTML is derived output and will be replaced by a rebuild. Archive prior outputs in
                  - code [ref=f40e714]: "#Old/"
                  - text: if needed.
                  - code [ref=f40e715]: "#Temp/"
                  - text: is for temporary builds; the builder reads explicit canonical paths, not scratch or archive folders.
                - paragraph [ref=f40e716]:
                  - text: Diagram SVG previews are checked against source and image hashes. When changing Mermaid source, update its matching SVG and intentionally refresh the manifest under
                  - code [ref=f40e717]: Authoring/diagrams/<app>/
                  - text: . A stale preview is omitted; the edited Mermaid code is still shown. The builder does not execute Mermaid.
                - generic [ref=f40e718]:
                  - heading "Template workflow" [level=2] [ref=f40e719]
                  - 'link "Permalink: Template workflow" [ref=f40e720] [cursor=pointer]':
                    - /url: "#template-workflow"
                - paragraph [ref=f40e723]:
                  - text: Use the Google Drive link on the master page for the full New+ ZIP. Extract it completely and read the package README before running its installer. The installer skips existing same-named templates by default;
                  - code [ref=f40e724]: "-Overwrite"
                  - text: backs up matching entries before replacement. The installer does not enable New+ or change PowerToys settings. To install only selected entries, open New+ > Open templates and copy the desired contents of
                  - code [ref=f40e725]: NewPlus-Templates/
                  - text: .
                - paragraph [ref=f40e726]:
                  - text: After creating a copy with New+, edit that copy. Each editable single-guide project has its own
                  - code [ref=f40e727]: content/guide.md
                  - text: SSOT and
                  - code [ref=f40e728]: Build-Guide.cmd
                  - text: . It is independent of this collection's canonical sources. To update this collection, reconcile approved Markdown into
                  - code [ref=f40e729]: "#Source/"
                  - text: ", then rebuild here."
                - paragraph [ref=f40e730]: Existing product-verification dates are retained; newly authored Codex and Claude Code guides cite official documentation reviewed on 31 October 2026. HTML validation is not proof of installation or native-account entitlements.
                - generic [ref=f40e731]:
                  - heading "Separate app downloads" [level=2] [ref=f40e732]
