      - region [ref=f39e156]:
        - heading "How to use the packs with New+" [level=2] [ref=f39e157]
        - list [ref=f39e158]:
          - listitem [ref=f39e159]:
            - strong [ref=f39e160]: Download and extract the whole ZIP.
            - text: Use the complete collection link or an app's separate ZIP card, then extract to a normal folder. Do not run scripts inside a ZIP preview.
          - listitem [ref=f39e161]:
            - strong [ref=f39e162]: Enable PowerToys New+.
            - text: Open PowerToys Settings and enable New+. Reading the guides requires neither PowerToys nor Python.
          - listitem [ref=f39e163]:
            - strong [ref=f39e164]: Install the templates.
            - text: Read the extracted README, then run
            - code [ref=f39e165]: Install-NewPlus-Templates.cmd
            - text: . It skips existing same-named entries. To refresh matching entries with backups, run
            - code [ref=f39e166]: .\Install-NewPlus-Templates.ps1 -Overwrite
            - text: from the extracted folder.
          - listitem [ref=f39e167]:
            - strong [ref=f39e168]: Or copy selected entries manually.
            - text: Choose
            - strong [ref=f39e169]: New+ → Open templates
            - text: in File Explorer and copy the desired items from
            - code [ref=f39e170]: NewPlus-Templates/
            - text: into that folder. Copy its contents, not the enclosing directory.
          - listitem [ref=f39e171]:
            - strong [ref=f39e172]: Create a guide or workspace.
            - text: Right-click an empty area in your destination folder, choose
            - strong [ref=f39e173]: New+
            - text: ", then select a complete guide, an editable source project, an Atlas workspace, or the full library. New+ creates a copy."
          - listitem [ref=f39e174]:
            - strong [ref=f39e175]: Edit and rebuild when needed.
            - text: In an editable guide project, change
            - code [ref=f39e176]: content/guide.md
            - text: and
            - code [ref=f39e177]: guide.config.json
            - text: ", then run"
            - code [ref=f39e178]: Build-Guide.cmd
            - text: . Python 3.9+ is needed only for rebuilding. The full library has
            - code [ref=f39e179]: Build-Library.cmd
            - text: for rebuilding every guide and the master from its saved Markdown sources.
        - paragraph [ref=f39e180]:
          - code [ref=f39e181]: "#Old/"
          - text: stores previous revisions;
          - code [ref=f39e182]: "#Temp/"
          - text: stores temporary work. They are not active source directories. Optional dated templates require New+'s filename-variable setting; variables change names, not file contents. The installer does not enable settings, sign into AI applications, or connect accounts.
        - paragraph [ref=f39e183]:
          - link "Microsoft's New+ documentation" [ref=f39e184] [cursor=pointer]:
            - /url: https://learn.microsoft.com/en-us/windows/powertoys/newplus
          - text: ·
          - link "Local library maintenance guide" [ref=f39e185] [cursor=pointer]:
            - /url: publishing.html
      - paragraph [ref=f39e187]: The original manuals retain their product-verification dates. This collection's HTML/build checks do not establish native app installation or account entitlement. For offline reading, use the standalone HTML exports; Google Drive and external documentation require internet access.